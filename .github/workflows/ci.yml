name: CI

on:
  push:
    branches: [main, 'claude/**']
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Typecheck, unit tests, build, package guards
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm check
      - uses: actions/upload-artifact@v4
        with:
          name: torvia-dist
          path: dist/torvia
          retention-days: 7

  e2e:
    name: E2E · qBittorrent ${{ matrix.qbt }}
    needs: check
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # Oldest supported (5.0) through latest. Keep in sync with MIN_SUPPORTED in src/api/capabilities.ts.
        qbt: [5.0.5-1, 5.1.4-1, 5.2.0-1, latest]
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - uses: actions/download-artifact@v4
        with:
          name: torvia-dist
          path: dist/torvia
      - run: pnpm exec playwright install --with-deps chromium
      - run: bash e2e/run-qbt.sh ${{ matrix.qbt }}
      - run: pnpm e2e
      # The axe audit is slow, so it runs once, against the newest qBittorrent.
      - if: matrix.qbt == 'latest'
        run: pnpm e2e:a11y
        timeout-minutes: 40
      - if: failure()
        run: docker logs torvia-qbt || true
