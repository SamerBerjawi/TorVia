name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write
  id-token: write
  attestations: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Tag must match package.json version
        run: |
          VERSION="v$(node -p "require('./package.json').version")"
          [ "$VERSION" = "$GITHUB_REF_NAME" ] || { echo "Tag $GITHUB_REF_NAME != package.json $VERSION"; exit 1; }
      - run: pnpm check
      - run: pnpm package
      - name: Checksums
        working-directory: dist
        run: sha256sum nuvora-*.zip > SHA256SUMS.txt && cat SHA256SUMS.txt
      - uses: actions/attest-build-provenance@v2
        with:
          subject-path: dist/nuvora-*.zip
      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" dist/nuvora-*.zip dist/SHA256SUMS.txt \
            --title "Nuvora $GITHUB_REF_NAME" --generate-notes --prerelease
